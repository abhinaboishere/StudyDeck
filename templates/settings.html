<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Study Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>
  (function(){
    var t = localStorage.getItem('studydeck-theme') || 'light';
    if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="topbar-left">
      <a class="back-pill" href="{{ url_for('index') }}">&larr; Study Deck</a>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="themeToggle" title="Toggle dark mode" type="button">
        <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none;"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </div>

  <header class="brand">
    <div>
      <h1>Settings</h1>
      <span>Your profile</span>
    </div>
  </header>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="settings-panel" style="padding-bottom:0;">
        {% for m in messages %}<div class="flash-msg">{{ m }}</div>{% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <div class="settings-panel">
    <div class="avatar-section" style="border-bottom:none;margin-bottom:0;padding-bottom:0;">
      {% if current_user.avatar_data %}
        <img class="avatar-large" src="{{ current_user.avatar_data }}" alt="">
      {% else %}
        <div class="avatar-large-placeholder">{{ current_user.email[0]|upper }}</div>
      {% endif %}
      <div class="avatar-info">
        <div class="avatar-email">{{ current_user.email }}</div>
        <form action="{{ url_for('upload_avatar') }}" method="POST" enctype="multipart/form-data" id="avatarForm">
          <label class="avatar-upload-btn" for="avatarInput">Change profile picture</label>
          <input type="file" id="avatarInput" name="avatar" accept="image/*" onchange="document.getElementById('avatarForm').submit();">
        </form>
      </div>
    </div>
  </div>

  <div class="logout-section">
    <a class="logout-btn" href="{{ url_for('logout') }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Log out
    </a>
  </div>
</div>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
